aid: ndea
name: Ndea
description: Ndea is an AI research and science laboratory founded by Francois Chollet (creator of the
  Keras deep learning library and the ARC-AGI benchmark) and Mike Knoop (co-founder of Zapier) with the
  mission of building frontier AI systems that blend intuitive pattern recognition and formal reasoning
  into a single unified architecture. Ndea treats program synthesis, enhanced by deep learning, as a pathway
  to artificial general intelligence, arguing that synthesizing discrete programs that explain observed
  data generalizes better from few examples than deep learning alone. Its stated ambition is to build
  a "factory for rapid scientific advancement." Both founders also serve on the board of the nonprofit
  ARC Prize Foundation. Ndea publishes no public API, developer portal, or SDK at this time; this profile
  tracks the company's public web surface and is added to the API Evangelist network as a Menlo Ventures
  portfolio lead.
